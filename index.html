<style>
  :root{
    --rose-50:#FFF1F2; --rose-100:#FFE1E8; --rose-200:#FEC9D6; --rose-300:#FDA4B8; --rose-400:#FB7185;
    --orange-50:#FFF7ED; --orange-100:#FFEDD5; --orange-200:#FED7AA; --orange-400:#FB923C;
    --purple-50:#FAF5FF; --purple-100:#F3E8FF; --purple-400:#C084FC;
    --emerald-50:#ECFDF5; --emerald-100:#D1FAE5; --emerald-400:#34D399; --emerald-500:#10B981;
    --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-400:#FBBF24; --amber-500:#F59E0B;
    --stone-700:#44403C; --stone-600:#57534E; --stone-500:#78716C; --stone-400:#A8A29E; --stone-300:#D6D3D1; --stone-100:#F5F5F4;
    --font-display: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-body: "Nunito", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: var(--font-body);
    color: var(--stone-700);
    background: linear-gradient(to bottom, var(--rose-50), rgba(255,247,237,.4) 40%, rgba(250,245,255,.4));
    -webkit-font-smoothing:antialiased;
  }
  #app{ display:flex; min-height:100vh; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--rose-200); border-radius:10px; }

  /* ---- Left icon rail ---- */
  .rail{
    width:64px; flex-shrink:0; min-height:100vh;
    background:rgba(255,255,255,.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-right:1px solid #fff;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:16px 0; position:sticky; top:0;
  }
  .rail-logo{ font-size:22px; margin-bottom:10px; animation:floatY 3.5s ease-in-out infinite; }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .rail-btn{
    width:44px; height:44px; border-radius:16px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:transparent;
    color:var(--stone-400); font-size:17px; transition:all .15s ease;
  }
  .rail-btn:hover{ background:var(--rose-50); }

    <div class="section-title-left">
      <div class="section-icon">${icon}</div>
      <h2>${esc(title)}</h2>
    </div>
    ${actionHtml || ""}
  </div>`;
}

function emptyState(mascot, title, subtitle){
  return `<div class="empty-state">
    <div class="mascot">${mascot}</div>
    <div class="title">${esc(title)}</div>
    <div class="subtitle">${esc(subtitle)}</div>
  </div>`;
}

function ghostBtn(label, action, value, scope, active){
  return `<button class="btn-ghost${active ? " active" : ""}" data-action="${action}" data-value="${esc(value)}" data-scope="${scope||""}">${esc(label)}</button>`;
}

/* ---------------- Page: AI 创作室 AI Studio ---------------- */

function pageStudio(){
  const post = viralPosts.find(p => p.id === state.studioSource) || viralPosts[0];
  const options = viralPosts.map(p => `<option value="${p.id}" ${p.id === state.studioSource ? "selected" : ""}>${esc(p.title)}</option>`).join("");

  const fnGrid = studioFns.map(f => `
    <button class="clickable" data-action="studio-select-fn" data-key="${f.key}"
      style="display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;padding:12px 6px;text-align:center;border:none;cursor:pointer;
      background:${state.studioActiveFn === f.key ? "linear-gradient(135deg,var(--rose-300),var(--orange-200))" : "rgba(255,255,255,.7)"};
      color:${state.studioActiveFn === f.key ? "#fff" : "var(--stone-500)"};
      box-shadow:${state.studioActiveFn === f.key ? "0 6px 16px rgba(251,113,133,.3)" : "none"};">
      <span style="font-size:17px;">${f.icon}</span>
      <span style="font-size:10px;font-weight:800;line-height:1.2;">${esc(f.label)}</span>
    </button>`).join("");

  let outputHtml = "";
  if (state.studioActiveFn){
    const label = studioFns.find(f => f.key === state.studioActiveFn).label;

    const lineHtml = lines.map((line, idx) => `<div style="font-size:12px;border-radius:14px;background:rgba(255,241,242,.7);padding:10px;color:var(--stone-600);line-height:1.6;margin-bottom:6px;">${idx+1}. ${esc(line)}</div>`).join("");
    const rewriteBtns = rewriteFns.map(r => `<button class="btn-ghost">🔄 ${esc(r)}</button>`).join("");
    outputHtml = card(`<div class="p-4">

  return `

          <div style="border-radius:10px;background:var(--purple-50);padding:8px;"><b class="text-stone-600" style="display:block;">情绪点</b>${post.triggers.length}个</div>

  const stats = [
    { label:"爆款存档", value:viralPosts.length, icon:"🔥", tone:"pink" },
    { label:"热词存档", value:keywordData.length, icon:"#️⃣", tone:"lavender" },
    { label:"对标账号", value:competitors.length, icon:"👥", tone:"mint" },
    { label:"灵感笔记", value:inspirations.length, icon:"💡", tone:"amber" },
  ];
  const statCards = stats.map(s => `
    <div class="card p-4">
      <div style="width:32px;height:32px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;" class="${STAT_TONE[s.tone]}">${s.icon}</div>
      <p style="font-family:var(--font-display);font-weight:800;font-size:20px;margin:0;color:var(--stone-700);">${s.value}</p>
      <p class="text-xs text-stone-400" style="margin:0;">${s.label}</p>
    </div>`).join("");

  const folders = ["图片素材","截图收藏","内容模板","写作历史"];
  const folderCards = folders.map(f => `
    <div class="flex items-center gap-2" style="border-radius:14px;background:var(--rose-50);padding:10px;">
      <span style="color:var(--orange-400);">📁</span><span class="text-xs font-bold text-stone-600">${esc(f)}</span>
    </div>`).join("");

  return `
    ${sectionTitle("💾","数据中心")}
    <div class="grid-2 mb-4">${statCards}</div>
    ${card(`<div class="p-4"><p class="text-xs font-extrabold text-stone-500" style="margin:0 0 8px;">我的内容资产库</p><div class="grid-2">${folderCards}</div></div>`, { className:"mb-4" })}
    ${card(`<div class="p-4">
        <p class="text-xs font-extrabold text-stone-500" style="margin:0 0 4px;">备份与同步</p>
        <div class="flex items-center justify-between" style="padding:6px 0;"><span class="text-xs text-stone-500">自动备份</span>${pill("已开启","pill-mint")}</div>
        <div class="flex items-center justify-between" style="padding:6px 0;"><span class="text-xs text-stone-500">云端同步</span>${pill("即将上线","pill-amber")}</div>
      </div>`, { className:"mb-4" })}
    <div class="grid-3">
      <button class="btn-ghost" style="justify-content:center;padding:10px 4px;">⬇️ 导出 JSON</button>
      <button class="btn-ghost" style="justify-content:center;padding:10px 4px;">⬇️ 导出 CSV</button>
      <button class="btn-ghost" style="justify-content:center;padding:10px 4px;">⬇️ 导出 MD</button>
    </div>
    <button class="btn-ghost w-full mt-2" style="justify-content:center;padding:10px;">⬆️ 导入 / 恢复备份</button>
  `;
}

/* ---------------- Page: 设置 Settings ---------------- */

function settingRow(icon, label, value, action){
  return `<div class="flex items-center gap-3 clickable" data-action="${action||''}" style="padding:12px 0;border-bottom:1px solid var(--rose-50);">
    <div style="width:32px;height:32px;border-radius:12px;background:var(--rose-50);display:flex;align-items:center;justify-content:center;">${icon}</div>
    <span class="text-sm font-bold text-stone-600" style="flex:1;">${esc(label)}</span>
    <span class="text-xs text-stone-400">${esc(value)}</span>
    <span style="color:var(--stone-300);">›</span>
  </div>`;
}

function pageSettings(){
  return `
    ${sectionTitle("⚙️","设置")}
    ${card(`<div class="p-4">
        ${settingRow(state.darkLabel ? "🌙" : "☀️", "外观主题", state.darkLabel ? "深色模式" : "浅色模式", "toggle-dark")}
        ${settingRow("🔔", "通知提醒", state.notifOn ? "已开启" : "已关闭", "toggle-notif")}
        ${settingRow("🌐", "语言", "简体中文", "")}
        ${settingRow("💾", "备份设置", "每日自动备份", "")}
        ${settingRow("ℹ️", "关于瑶瑶工作台", "v1.0.0", "")}
      </div>`)}
    <div class="text-xs text-stone-300 mt-4" style="text-align:center;">🌸 瑶瑶工作台 · 用心陪伴每一次创作</div>
  `;
}

/* ---------------- Global search ---------------- */

function globalSearchOverlay(){
  const q = state.searchQuery.trim().toLowerCase();
  let resultsHtml;
  if (q === ""){
    resultsHtml = `<p class="text-xs text-stone-400" style="text-align:center;padding:24px 0;">输入关键词，全局搜索所有内容 🐰</p>`;
  } else {
    const results = [
      ...viralPosts.filter(p => p.title.toLowerCase().includes(q)).map(p => ({ type:"爆款", label:p.title, icon:"🔥" })),
      ...keywordData.filter(k => k.word.toLowerCase().includes(q)).map(k => ({ type:"热词", label:k.word, icon:"#️⃣" })),
      ...competitors.filter(c => c.name.toLowerCase().includes(q)).map(c => ({ type:"账号", label:c.name, icon:"👥" })),
      ...inspirations.filter(i => i.idea.toLowerCase().includes(q)).map(i => ({ type:"灵感", label:i.idea, icon:"💡" })),
    ];
    resultsHtml = results.length === 0
      ? emptyState("🐹","没有找到相关内容","换个关键词试试吧")
      : results.map(r => `<div class="flex items-center gap-2" style="padding:10px;border-radius:14px;">
          <span>${r.icon}</span><span class="text-xs text-stone-400">${r.type}</span><span class="text-sm text-stone-600 truncate">${esc(r.label)}</span>
        </div>`).join("");
  }

  return `<div class="search-overlay" data-action="close-search">
    <div class="search-panel" data-stop="1">
      <div class="search-input-wrap">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="搜索爆款、热词、账号、灵感……" value="${esc(state.searchQuery)}" data-bind="search-query" autocomplete="off" />
        <button data-action="close-search" style="border:none;background:transparent;cursor:pointer;font-size:15px;color:var(--stone-400);">✕</button>
      </div>
      <div style="margin-top:12px;max-height:60vh;overflow-y:auto;">${resultsHtml}</div>
    </div>
  </div>`;
}

/* ---------------- Root render ---------------- */

const PAGES = {
  dashboard: pageDashboard,
  radar: pageRadar,
  competitors: pageCompetitors,
  keywords: pageKeywords,
  inspiration: pageInspiration,
  studio: pageStudio,
  calendar: pageCalendar,
  data: pageData,
  settings: pageSettings,
};

function render(){
  const navHtml = NAV_ITEMS.map(item => `
    <button class="rail-btn${state.active === item.key ? " active" : ""}" data-action="nav" data-key="${item.key}" title="${esc(item.label)}">${item.icon}</button>
  `).join("");

  const currentLabel = (NAV_ITEMS.find(n => n.key === state.active) || {}).label || "";
  const pageFn = PAGES[state.active] || pageDashboard;

  let modalHtml = "";
  if (state.active === "radar" && state.selectedPostId){
    const post = viralPosts.find(p => p.id === state.selectedPostId);
    if (post) modalHtml = postDetailModal(post);
  }
  const searchHtml = state.searchOpen ? globalSearchOverlay() : "";

  const html = `
    <nav class="rail">
      <div class="rail-logo">🌸</div>
      ${navHtml}
    </nav>
    <div class="main">
      <div class="topbar">
        <h1>${esc(currentLabel)}</h1>
        <button class="icon-btn" data-action="open-search">🔍</button>
      </div>
      <div class="page">${pageFn()}</div>
    </div>
    ${modalHtml}
    ${searchHtml}
  `;

  const app = document.getElementById("app");
  app.innerHTML = html;

  // Restore focus to the search input (re-render replaces the DOM node)
  if (state.searchOpen){
    const input = document.getElementById("search-input");
    if (input){
      input.focus();
      const val = input.value;
      input.value = "";
      input.value = val; // caret to end
    }
  }
}

/* ---------------- Event delegation ---------------- */

document.getElementById("app").addEventListener("click", function(e){
  // Clicking directly on an overlay background (not its inner panel) closes it
  const overlay = e.target.closest(".modal-overlay, .search-overlay");
  if (overlay && e.target === overlay){
    if (overlay.classList.contains("modal-overlay")) state.selectedPostId = null;
    if (overlay.classList.contains("search-overlay")) { state.searchOpen = false; state.searchQuery = ""; }
    render();
    return;
  }

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  switch(action){
    case "nav":
      state.active = el.dataset.key;
      state.selectedPostId = null;
      render();
      break;
    case "open-post":
      state.selectedPostId = Number(el.dataset.id);
      render();
      break;
    case "open-post-from-dash":
      state.active = "radar";
      state.selectedPostId = Number(el.dataset.id);
      render();
      break;
    case "close-modal":
      state.selectedPostId = null;
      render();
      break;
    case "toggle-save":
      e.stopPropagation();
      state.savedPosts[el.dataset.id] = !state.savedPosts[el.dataset.id];
      render();
      break;
    case "set-radar-grade":
      state.radarGrade = el.dataset.value;
      render();
      break;
    case "set-radar-category":
      state.radarCategory = el.dataset.value;
      render();
      break;
    case "set-keyword-grade":
      state.keywordGrade = el.dataset.value;
      render();
      break;
    case "toggle-competitor":
      state.expandedCompetitor = state.expandedCompetitor === Number(el.dataset.id) ? null : Number(el.dataset.id);
      render();
      break;
    case "studio-select-fn":
      state.studioActiveFn = el.dataset.key;
      render();
      break;
    case "set-calendar-tab":
      state.calendarTab = el.dataset.value;
      render();
      break;
    case "open-search":
      state.searchOpen = true;
      render();
      break;
    case "close-search":
      state.searchOpen = false;
      state.searchQuery = "";
      render();
      break;
    case "toggle-dark":
      state.darkLabel = !state.darkLabel;
      render();
      break;
    case "toggle-notif":
      state.notifOn = !state.notifOn;
      render();
      break;
  }
});

document.getElementById("app").addEventListener("change", function(e){
  if (e.target.matches('[data-bind="studio-source"]')){
    state.studioSource = Number(e.target.value);
    render();
  }
});

document.getElementById("app").addEventListener("input", function(e){
  if (e.target.matches('[data-bind="search-query"]')){
    state.searchQuery = e.target.value;
    render();
  }
});

render();
</script>
</body>
</html>
